{% load static %}
<link rel="stylesheet" href="{% static 'orthowiki/style.css' %}">

<h1>{{ article.title}} </h1>
<small>
    Published on: {{ article.pub_date }}
    {% if article.mod_date != article.pub_date %}
        | Modified on: {{ article.mod_date }}
    {% endif %}
</small>
<br>
{{ article.content|safe }}

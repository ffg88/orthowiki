{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}OrthoWiki{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'orthowiki/style.css' %}">
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <nav class="navbar bg-body-secondary border-bottom">
            <div class="container d-flex flex-column align-items-center justify-content-center my-3" style="max-width: 940px;">
                <a class="navbar-brand me-0 fw-bold fs-1" href="#">OrthoWiki</a>
                <span class="navbar-text">{{ t.top_message }}</span>
                <ul class="navbar-nav flex-row gap-2">
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="#">{{ t.menu_about }}</a>
                    </li>
                    <li class="nav-text d-flex align-items-center">|</li>
                    <li class="nav-item">
                        <a class="nav-link fw-bold" href="#">{{ t.menu_contact }}</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="container d-flex flex-column align-items-center justify-content-center my-5" style="max-width: 850px;">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="mt-auto">
        <nav class="navbar bg-body-secondary border-top">
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center" style="max-width: 940px;">
                <div class="footer-message">
                    <ul class="navbar-nav flex-row gap-2">
                        <li class="nav-text">
                            OrthoWiki
                        </li>
                        <li class="nav-text">
                            |
</li>
                        <li class="nav-text">
                            {{ t.bottom_message }}
                        </li>
                    </ul>
                </div>
                <div class="language-switcher">
                    <ul class="navbar-nav flex-row gap-2">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'orthowiki:index' lang_code='en' %}">English</a>
                        </li>
                        <li class="nav-text d-flex align-items-center">|</li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'orthowiki:index' lang_code='pt' %}">Português</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
